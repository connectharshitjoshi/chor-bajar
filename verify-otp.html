<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP | Chorbajar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="ecommerce-products/electronics/wireless-bluetooth-headphones.jpg">
  <style>
    .otp-input-wrap {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 1.5rem 0;
    }
    .otp-box {
      width: 48px;
      height: 52px;
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all 0.2s;
    }
    .otp-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body>

  <div id="site-header-container"></div>

  <main class="auth-page-wrap">
    <div class="auth-card" style="text-align: center;" data-testid="otp-card">
      <div class="auth-header">
        <h1 class="auth-title">Verify OTP Code</h1>
        <p class="auth-subtitle">
          We have sent a 6-digit verification code to <br>
          <strong id="display-otp-email" style="color: var(--text-main);">user@test.com</strong>
        </p>
      </div>

      <!-- Demo Hint -->
      <div class="qa-badge" style="display: inline-block; margin-bottom: 1rem; background: #e0f2fe; color: #0284c7; padding: 4px 10px;">
        💡 Demo QA Valid OTP: <strong>123456</strong>
      </div>

      <!-- Error / Status Alert -->
      <div id="otp-error-alert" style="display: none; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;" data-testid="otp-error">
      </div>

      <form id="otp-form" data-testid="otp-form">
        <!-- Unified / Box inputs -->
        <div class="form-group">
          <input 
            type="text" 
            id="otp-unified-input" 
            class="form-control" 
            maxlength="6" 
            placeholder="Enter 6-digit OTP (e.g. 123456)" 
            style="letter-spacing: 6px; font-size: 1.2rem; text-align: center; font-weight: 700;"
            required 
            data-testid="otp-input"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-verify-otp" data-testid="verify-otp-btn">
          Verify & Proceed &rarr;
        </button>
      </form>

      <!-- Timer & Resend -->
      <div style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        <div id="otp-timer-wrap" style="margin-bottom: 8px;">
          Time remaining: <strong id="otp-timer" data-testid="otp-timer" style="color: var(--primary);">00:60</strong>
        </div>
        <div>
          Didn't receive code? 
          <button type="button" id="btn-resend-otp" disabled style="color: var(--primary); font-weight: 600; cursor: not-allowed; opacity: 0.5;" data-testid="resend-otp-btn">
            Resend OTP
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const email = window.ChorbajarApp.getUrlParam('email') || 'user@test.com';
      const purpose = window.ChorbajarApp.getUrlParam('purpose') || 'register';
      document.getElementById('display-otp-email').textContent = email;

      const form = document.getElementById('otp-form');
      const input = document.getElementById('otp-unified-input');
      const errBox = document.getElementById('otp-error-alert');
      const timerElem = document.getElementById('otp-timer');
      const resendBtn = document.getElementById('btn-resend-otp');

      // Countdown Timer (60s)
      let timeLeft = 60;
      let timerInterval = null;

      function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 60;
        resendBtn.disabled = true;
        resendBtn.style.opacity = '0.5';
        resendBtn.style.cursor = 'not-allowed';

        timerInterval = setInterval(() => {
          timeLeft--;
          const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
          const secs = String(timeLeft % 60).padStart(2, '0');
          timerElem.textContent = `${mins}:${secs}`;

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerElem.textContent = 'Expired';
            errBox.textContent = 'OTP has expired. Please click "Resend OTP" to generate a new code.';
            errBox.style.display = 'block';
            resendBtn.disabled = false;
            resendBtn.style.opacity = '1';
            resendBtn.style.cursor = 'pointer';
          }
        }, 1000);
      }

      startTimer();

      resendBtn.onclick = () => {
        errBox.style.display = 'none';
        window.ChorbajarApp.showToast('New simulated OTP (123456) sent to ' + email, 'info');
        startTimer();
      };

      form.onsubmit = (e) => {
        e.preventDefault();
        errBox.style.display = 'none';

        if (timeLeft <= 0) {
          errBox.textContent = 'The OTP has expired. Please click Resend OTP.';
          errBox.style.display = 'block';
          return;
        }

        const val = input.value.trim();

        if (val === '123456') {
          clearInterval(timerInterval);
          window.ChorbajarApp.showToast('OTP verified successfully!', 'success');

          setTimeout(() => {
            if (purpose === 'reset') {
              window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
            } else {
              window.location.href = 'account-profile.html';
            }
          }, 600);
        } else {
          errBox.textContent = 'Invalid OTP code. For testing, please enter 123456.';
          errBox.style.display = 'block';
          window.ChorbajarApp.showToast('Invalid OTP entered.', 'danger');
        }
      };
    });
  </script>
</body>
</html>

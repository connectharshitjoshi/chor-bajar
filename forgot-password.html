<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Chorbajar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="ecommerce-products/electronics/wireless-bluetooth-headphones.jpg">
</head>
<body>

  <div id="site-header-container"></div>

  <main class="auth-page-wrap">
    <div class="auth-card" data-testid="forgot-password-card">
      <div class="auth-header">
        <h1 class="auth-title">Reset Your Password</h1>
        <p class="auth-subtitle">Enter your registered email address to receive password reset instructions and OTP.</p>
      </div>

      <div id="forgot-msg-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;" data-testid="forgot-message">
      </div>

      <form id="forgot-form" data-testid="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Registered Email Address</label>
          <input 
            type="email" 
            id="forgot-email" 
            class="form-control" 
            required 
            placeholder="e.g. user@test.com" 
            data-testid="forgot-email"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-forgot-submit" data-testid="forgot-submit">
          Send Reset Instructions &rarr;
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Remembered your password? <a href="login.html" style="color: var(--primary); font-weight: 600;" data-testid="back-to-login">Back to Sign In</a>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('forgot-email');
      const msgAlert = document.getElementById('forgot-msg-alert');

      form.onsubmit = (e) => {
        e.preventDefault();
        const email = emailInput.value.trim().toLowerCase();

        if (!email || !email.includes('@')) {
          msgAlert.className = 'status-pill status-blocked';
          msgAlert.style.display = 'block';
          msgAlert.textContent = 'Please enter a valid email address.';
          return;
        }

        const users = window.ChorbajarStorage.getUsers();
        const userExists = users.some(u => u.email.toLowerCase() === email);

        if (!userExists) {
          msgAlert.style.background = 'var(--danger-bg)';
          msgAlert.style.border = '1px solid var(--danger-border)';
          msgAlert.style.color = 'var(--danger)';
          msgAlert.style.display = 'block';
          msgAlert.textContent = 'No registered account found with this email.';
          return;
        }

        msgAlert.style.background = 'var(--success-bg)';
        msgAlert.style.border = '1px solid var(--success-border)';
        msgAlert.style.color = 'var(--success)';
        msgAlert.style.display = 'block';
        msgAlert.innerHTML = `✓ Reset instructions & OTP sent to <strong>${email}</strong>! Redirecting to OTP verification...`;

        setTimeout(() => {
          window.location.href = `verify-otp.html?email=${encodeURIComponent(email)}&purpose=reset`;
        }, 1200);
      };
    });
  </script>
</body>
</html>

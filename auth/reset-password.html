<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Chorbajar</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../assets/ecommerce-products/electronics/wireless-bluetooth-headphones.jpg">
  <style>
    .strength-meter {
      height: 6px;
      width: 100%;
      background: #e2e8f0;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
    }
    .strength-text {
      font-size: 0.75rem;
      margin-top: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="site-header-container"></div>

  <main class="auth-page-wrap">
    <div class="auth-card" data-testid="reset-password-card">
      <div class="auth-header">
        <h1 class="auth-title">Create New Password</h1>
        <p class="auth-subtitle">Choose a secure, strong password for your account</p>
      </div>

      <div id="reset-error-alert" style="display: none; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;" data-testid="reset-error">
      </div>

      <form id="reset-password-form" data-testid="reset-password-form">
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input 
            type="password" 
            id="new-password" 
            class="form-control" 
            required 
            placeholder="At least 6 characters" 
            data-testid="reset-new-password"
          />
          <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
          </div>
          <div class="strength-text" id="strength-text" data-testid="password-strength-indicator">Password Strength: -</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-new-password">Confirm New Password</label>
          <input 
            type="password" 
            id="confirm-new-password" 
            class="form-control" 
            required 
            placeholder="Re-enter new password" 
            data-testid="reset-confirm-password"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-reset-submit" data-testid="reset-password-submit">
          Update Password &rarr;
        </button>
      </form>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="../js/products-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const email = window.ChorbajarApp.getUrlParam('email') || 'user@test.com';
      const form = document.getElementById('reset-password-form');
      const newPwdInput = document.getElementById('new-password');
      const confPwdInput = document.getElementById('confirm-new-password');
      const errBox = document.getElementById('reset-error-alert');
      const strengthBar = document.getElementById('strength-bar');
      const strengthText = document.getElementById('strength-text');

      // Real-time strength calculator
      newPwdInput.oninput = () => {
        const val = newPwdInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        if (val.length === 0) {
          strengthBar.style.width = '0%';
          strengthText.textContent = 'Password Strength: -';
        } else if (score <= 1) {
          strengthBar.style.width = '25%';
          strengthBar.style.background = 'var(--danger)';
          strengthText.style.color = 'var(--danger)';
          strengthText.textContent = 'Password Strength: Weak';
        } else if (score === 2 || score === 3) {
          strengthBar.style.width = '65%';
          strengthBar.style.background = 'var(--warning)';
          strengthText.style.color = 'var(--warning)';
          strengthText.textContent = 'Password Strength: Moderate';
        } else {
          strengthBar.style.width = '100%';
          strengthBar.style.background = 'var(--success)';
          strengthText.style.color = 'var(--success)';
          strengthText.textContent = 'Password Strength: Strong';
        }
      };

      form.onsubmit = (e) => {
        e.preventDefault();
        errBox.style.display = 'none';

        const newPwd = newPwdInput.value;
        const confPwd = confPwdInput.value;

        if (newPwd.length < 6) {
          errBox.textContent = 'Password must be at least 6 characters.';
          errBox.style.display = 'block';
          return;
        }

        if (newPwd !== confPwd) {
          errBox.textContent = 'Passwords do not match.';
          errBox.style.display = 'block';
          return;
        }

        // Update password in storage
        const users = window.ChorbajarStorage.getUsers();
        const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
        if (user) {
          user.password = newPwd;
          localStorage.setItem('chorbajar_users', JSON.stringify(users));
        }

        window.ChorbajarApp.showToast('Password updated successfully! Please sign in.', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 800);
      };
    });
  </script>
</body>
</html>

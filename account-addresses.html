<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Addresses | Chorbajar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="ecommerce-products/electronics/wireless-bluetooth-headphones.jpg">
  <style>
    .addresses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    .address-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .address-card.is-default {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
  </style>
</head>
<body>

  <div id="site-header-container"></div>

  <main class="container">
    <div class="breadcrumbs" data-testid="breadcrumbs">
      <a href="index.html">Home</a>
      <span class="separator">/</span>
      <a href="account-profile.html">Account</a>
      <span class="separator">/</span>
      <span>Addresses</span>
    </div>

    <div class="dashboard-layout">
      <!-- Account Sidebar -->
      <aside class="sidebar-nav" data-testid="account-sidebar">
        <a href="account-profile.html" class="sidebar-link" data-testid="sidebar-profile">👤 Personal Information</a>
        <a href="account-orders.html" class="sidebar-link" data-testid="sidebar-orders">📦 My Orders & Tracking</a>
        <a href="account-addresses.html" class="sidebar-link active" data-testid="sidebar-addresses">📍 Saved Delivery Addresses</a>
        <a href="account-settings.html" class="sidebar-link" data-testid="sidebar-settings">⚙️ Account Settings</a>
      </aside>

      <!-- Addresses Main Content -->
      <section class="dashboard-content-card" data-testid="addresses-card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
          <h2 style="font-size: 1.35rem; font-weight: 800;">Saved Delivery Addresses</h2>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-address" data-testid="btn-add-address">
            + Add New Address
          </button>
        </div>

        <!-- Addresses Grid -->
        <div class="addresses-grid" id="addresses-grid" data-testid="addresses-grid"></div>

        <!-- Add / Edit Address Modal -->
        <div class="modal-overlay" id="address-modal">
          <div class="modal-dialog">
            <div class="modal-header">
              <h3 class="modal-title" id="addr-modal-title">Add Delivery Address</h3>
              <button class="btn-sm" id="addr-modal-close" style="font-size: 1.25rem;">&times;</button>
            </div>
            <form id="address-form" data-testid="address-form">
              <div class="modal-body">
                <input type="hidden" id="addr-id">
                
                <div class="form-group">
                  <label class="form-label">Contact Name *</label>
                  <input type="text" id="addr-name" class="form-control" required placeholder="e.g. Harshit Joshi" data-testid="addr-name">
                </div>

                <div class="form-group">
                  <label class="form-label">Phone Number (10 Digits) *</label>
                  <input type="tel" id="addr-phone" class="form-control" maxlength="10" required placeholder="e.g. 9876543210" data-testid="addr-phone">
                </div>

                <div class="form-group">
                  <label class="form-label">Flat / House No., Building Name *</label>
                  <input type="text" id="addr-line1" class="form-control" required placeholder="e.g. Flat 402, Sunshine Heights" data-testid="addr-line1">
                </div>

                <div class="form-group">
                  <label class="form-label">Street, Colony, Landmark</label>
                  <input type="text" id="addr-line2" class="form-control" placeholder="e.g. Indiranagar, Near Metro" data-testid="addr-line2">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                  <div class="form-group">
                    <label class="form-label">City *</label>
                    <input type="text" id="addr-city" class="form-control" required placeholder="Bengaluru" data-testid="addr-city">
                  </div>
                  <div class="form-group">
                    <label class="form-label">State *</label>
                    <input type="text" id="addr-state" class="form-control" required placeholder="Karnataka" data-testid="addr-state">
                  </div>
                  <div class="form-group">
                    <label class="form-label">PIN (6 Digits) *</label>
                    <input type="text" id="addr-pin" class="form-control" maxlength="6" required placeholder="560038" data-testid="addr-pin">
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Address Type</label>
                  <select id="addr-type" class="form-control" data-testid="addr-type">
                    <option value="Home">Home (All day delivery)</option>
                    <option value="Work">Work / Office (10 AM - 6 PM)</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="filter-checkbox-item">
                    <input type="checkbox" id="addr-default" data-testid="addr-is-default">
                    <span>Make this my default delivery address</span>
                  </label>
                </div>
              </div>

              <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" id="addr-modal-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary btn-sm" data-testid="btn-save-address">Save Address</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.ChorbajarApp.requireAuth()) return;

      const user = window.ChorbajarStorage.getCurrentUser();
      const modal = document.getElementById('address-modal');
      const form = document.getElementById('address-form');

      function renderAddresses() {
        const addresses = window.ChorbajarStorage.getAddresses(user.id);
        const grid = document.getElementById('addresses-grid');

        grid.innerHTML = addresses.map(addr => `
          <div class="address-card ${addr.isDefault ? 'is-default' : ''}" data-testid="address-card-${addr.id}">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="qa-badge" style="background: var(--bg-subtle); color: var(--text-main);">${addr.addressType}</span>
                ${addr.isDefault ? '<span class="status-pill status-active" style="font-size: 0.7rem;">Default</span>' : ''}
              </div>

              <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 6px;">${addr.fullName}</h4>
              <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 8px;">
                ${addr.addressLine1},<br>
                ${addr.addressLine2 ? addr.addressLine2 + ',<br>' : ''}
                ${addr.city}, ${addr.state} - <strong>${addr.pincode}</strong>
              </p>
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">Phone: ${addr.phone}</div>
            </div>

            <div style="display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 0.8rem;">
              <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="window.editAddress(${addr.id})" data-testid="edit-address-${addr.id}">Edit</button>
              <button type="button" class="btn btn-secondary btn-sm" style="color: var(--danger);" onclick="window.deleteAddressPrompt(${addr.id})" data-testid="delete-address-${addr.id}">Delete</button>
              ${!addr.isDefault ? `
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="window.makeDefaultAddress(${addr.id})" data-testid="make-default-${addr.id}">Set Default</button>
              ` : ''}
            </div>
          </div>
        `).join('');
      }

      function openModal(addr = null) {
        if (addr) {
          document.getElementById('addr-modal-title').textContent = 'Edit Address';
          document.getElementById('addr-id').value = addr.id;
          document.getElementById('addr-name').value = addr.fullName;
          document.getElementById('addr-phone').value = addr.phone;
          document.getElementById('addr-line1').value = addr.addressLine1;
          document.getElementById('addr-line2').value = addr.addressLine2 || '';
          document.getElementById('addr-city').value = addr.city;
          document.getElementById('addr-state').value = addr.state;
          document.getElementById('addr-pin').value = addr.pincode;
          document.getElementById('addr-type').value = addr.addressType || 'Home';
          document.getElementById('addr-default').checked = !!addr.isDefault;
        } else {
          document.getElementById('addr-modal-title').textContent = 'Add Delivery Address';
          form.reset();
          document.getElementById('addr-id').value = '';
          document.getElementById('addr-name').value = user.name;
          document.getElementById('addr-phone').value = user.phone || '';
        }
        modal.classList.add('show');
      }

      function closeModal() {
        modal.classList.remove('show');
      }

      document.getElementById('btn-add-address').onclick = () => openModal();
      document.getElementById('addr-modal-close').onclick = closeModal;
      document.getElementById('addr-modal-cancel').onclick = closeModal;

      window.editAddress = (id) => {
        const addr = window.ChorbajarStorage.getAddresses(user.id).find(a => a.id === id);
        if (addr) openModal(addr);
      };

      window.deleteAddressPrompt = (id) => {
        window.ChorbajarApp.showConfirmModal(
          'Delete Address?',
          'Are you sure you want to permanently delete this delivery address?',
          () => {
            window.ChorbajarStorage.deleteAddress(id);
            window.ChorbajarApp.showToast('Address deleted.', 'info');
            renderAddresses();
          }
        );
      };

      window.makeDefaultAddress = (id) => {
        window.ChorbajarStorage.setDefaultAddress(id, user.id);
        window.ChorbajarApp.showToast('Default address updated!', 'success');
        renderAddresses();
      };

      form.onsubmit = (e) => {
        e.preventDefault();
        const idVal = document.getElementById('addr-id').value;
        const name = document.getElementById('addr-name').value.trim();
        const phone = document.getElementById('addr-phone').value.trim();
        const line1 = document.getElementById('addr-line1').value.trim();
        const line2 = document.getElementById('addr-line2').value.trim();
        const city = document.getElementById('addr-city').value.trim();
        const state = document.getElementById('addr-state').value.trim();
        const pin = document.getElementById('addr-pin').value.trim();
        const type = document.getElementById('addr-type').value;
        const isDefault = document.getElementById('addr-default').checked;

        // Validation
        const phoneRegex = /^[6-9]\d{9}$/;
        if (!phoneRegex.test(phone)) {
          window.ChorbajarApp.showToast('Please enter a valid 10-digit phone number.', 'danger');
          return;
        }

        const pinRegex = /^[1-9][0-9]{5}$/;
        if (!pinRegex.test(pin)) {
          window.ChorbajarApp.showToast('Please enter a valid 6-digit Indian PIN code.', 'danger');
          return;
        }

        const addrObj = {
          userId: user.id,
          fullName: name,
          phone: phone,
          addressLine1: line1,
          addressLine2: line2,
          city: city,
          state: state,
          pincode: pin,
          addressType: type,
          isDefault: isDefault
        };

        if (idVal) addrObj.id = Number(idVal);

        window.ChorbajarStorage.saveAddress(addrObj);
        closeModal();
        window.ChorbajarApp.showToast('Address saved successfully!', 'success');
        renderAddresses();
      };

      renderAddresses();
    });
  </script>
</body>
</html>

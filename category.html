<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | Chorbajar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="ecommerce-products/electronics/wireless-bluetooth-headphones.jpg">
</head>
<body>

  <div id="site-header-container"></div>

  <main class="container">
    <!-- Breadcrumbs -->
    <div class="breadcrumbs" data-testid="breadcrumbs">
      <a href="index.html">Home</a>
      <span class="separator">/</span>
      <a href="products.html">Categories</a>
      <span class="separator">/</span>
      <span id="category-breadcrumb-title">Category</span>
    </div>

    <!-- Category Header Banner -->
    <div class="hero-slider" style="padding: 2rem 2.5rem; margin-bottom: 2rem;" data-testid="category-banner">
      <div class="hero-content">
        <span class="hero-tag" id="category-badge">Category Showcase</span>
        <h1 class="hero-title" id="category-title" style="font-size: 2rem;">Category Name</h1>
        <p class="hero-desc" id="category-description">Category description goes here.</p>
      </div>
      <div class="hero-image-wrap" style="max-width: 200px;">
        <img id="category-banner-img" src="" alt="Category Image" style="width: 180px; height: 180px; object-fit: cover; border-radius: 12px;">
      </div>
    </div>

    <!-- Products & Filter Grid -->
    <div class="catalog-layout">
      <!-- Sidebar Filters -->
      <aside class="filter-sidebar" data-testid="category-filter-sidebar">
        <div class="filter-header">
          <h3 class="filter-title">Filters</h3>
          <button type="button" class="filter-clear-btn" id="cat-filter-clear">Reset</button>
        </div>

        <div class="filter-group">
          <label class="filter-checkbox-item">
            <input type="checkbox" id="cat-filter-in-stock" data-testid="cat-filter-in-stock">
            <span style="font-weight: 600;">In Stock Only</span>
          </label>
        </div>

        <div class="filter-group">
          <h4 class="filter-group-title">Brands</h4>
          <ul class="filter-list" id="category-brand-filter-list"></ul>
        </div>

        <div class="filter-group">
          <h4 class="filter-group-title">Rating</h4>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="filter-checkbox-item">
              <input type="radio" name="cat-rating" value="4.0" data-testid="cat-rating-4">
              <span>★ 4.0 & above</span>
            </label>
            <label class="filter-checkbox-item">
              <input type="radio" name="cat-rating" value="0" checked data-testid="cat-rating-all">
              <span>All Ratings</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Main Listing -->
      <section class="catalog-main">
        <div class="catalog-top-controls">
          <div class="results-count" data-testid="category-product-count">
            Showing <strong id="cat-visible-count">0</strong> products in this category
          </div>
          <div class="sort-wrap">
            <label for="cat-sort-select">Sort:</label>
            <select id="cat-sort-select" class="form-control" style="width: auto; padding: 6px 12px;" data-testid="cat-sort-select">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating-desc">Rating: High to Low</option>
              <option value="discount-desc">Discount: High to Low</option>
            </select>
          </div>
        </div>

        <div class="products-grid" id="category-products-grid" data-testid="category-products-grid"></div>

        <div class="empty-state" id="category-empty-state" style="display: none;" data-testid="category-empty-state">
          <div class="empty-state-icon">📦</div>
          <h3 class="empty-state-title">No products found in this category</h3>
          <p class="empty-state-desc">Try resetting your active filters or check another category.</p>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const catParam = window.ChorbajarApp.getUrlParam('name') || 'electronics';
      const categories = window.CHORBAJAR_CATEGORIES || [];
      const currentCategory = categories.find(c => c.slug.toLowerCase() === catParam.toLowerCase() || c.name.toLowerCase() === catParam.toLowerCase()) || categories[0];

      // Set Banner & Title
      document.title = `${currentCategory.name} | Chorbajar`;
      document.getElementById('category-breadcrumb-title').textContent = currentCategory.name;
      document.getElementById('category-title').textContent = currentCategory.name;
      document.getElementById('category-description').textContent = currentCategory.description;
      document.getElementById('category-banner-img').src = currentCategory.image;

      // Filter products
      const allProducts = window.ChorbajarStorage.getProducts();
      const catProducts = allProducts.filter(p => p.category === currentCategory.name || p.categorySlug === currentCategory.slug);

      // Brands in this category
      const catBrands = [...new Set(catProducts.map(p => p.brand))].sort();
      const brandListElem = document.getElementById('category-brand-filter-list');
      brandListElem.innerHTML = catBrands.map(b => `
        <li>
          <label class="filter-checkbox-item">
            <input type="checkbox" value="${b}" class="cat-brand-cb" data-testid="filter-brand-${b}">
            <span>${b}</span>
          </label>
        </li>
      `).join('');

      let selectedBrands = [];
      let inStockOnly = false;
      let minRating = 0;
      let sortBy = 'featured';

      function renderCategoryProducts() {
        let items = catProducts.filter(p => {
          if (selectedBrands.length > 0 && !selectedBrands.includes(p.brand)) return false;
          if (inStockOnly && p.stock <= 0) return false;
          if (p.rating < minRating) return false;
          return true;
        });

        // Sort
        if (sortBy === 'price-asc') items.sort((a,b) => a.price - b.price);
        else if (sortBy === 'price-desc') items.sort((a,b) => b.price - a.price);
        else if (sortBy === 'rating-desc') items.sort((a,b) => b.rating - a.rating);
        else if (sortBy === 'discount-desc') items.sort((a,b) => b.discount - a.discount);

        document.getElementById('cat-visible-count').textContent = items.length;
        const gridElem = document.getElementById('category-products-grid');
        const emptyElem = document.getElementById('category-empty-state');

        if (items.length === 0) {
          gridElem.style.display = 'none';
          emptyElem.style.display = 'block';
        } else {
          gridElem.style.display = 'grid';
          emptyElem.style.display = 'none';
          gridElem.innerHTML = items.map(p => window.ChorbajarApp.renderProductCard(p)).join('');
        }
      }

      // Event handlers
      document.querySelectorAll('.cat-brand-cb').forEach(cb => {
        cb.onchange = () => {
          selectedBrands = Array.from(document.querySelectorAll('.cat-brand-cb:checked')).map(c => c.value);
          renderCategoryProducts();
        };
      });

      document.getElementById('cat-filter-in-stock').onchange = (e) => {
        inStockOnly = e.target.checked;
        renderCategoryProducts();
      };

      document.querySelectorAll('input[name="cat-rating"]').forEach(r => {
        r.onchange = () => {
          minRating = Number(r.value);
          renderCategoryProducts();
        };
      });

      document.getElementById('cat-sort-select').onchange = (e) => {
        sortBy = e.target.value;
        renderCategoryProducts();
      };

      document.getElementById('cat-filter-clear').onclick = () => {
        selectedBrands = [];
        inStockOnly = false;
        minRating = 0;
        sortBy = 'featured';
        document.querySelectorAll('.cat-brand-cb').forEach(c => c.checked = false);
        document.getElementById('cat-filter-in-stock').checked = false;
        document.querySelector('input[name="cat-rating"][value="0"]').checked = true;
        document.getElementById('cat-sort-select').value = 'featured';
        renderCategoryProducts();
      };

      renderCategoryProducts();
    });
  </script>
</body>
</html>
